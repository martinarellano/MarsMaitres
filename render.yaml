services:
  - type: web
    name: marsmaitre-api
    runtime: docker
    dockerfilePath: ./marsmaitre-backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: marsmaitre-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BILLING_MODE
        value: cash
      - key: ENVIRONMENT
        value: production
      - key: MARSMAITRE_ADMIN_EMAIL
        sync: false
      - key: MARSMAITRE_ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PORT
        value: 8787
      - key: MARSMAITRE_DB_PATH
        value: /data/marsmaitre.db
      - key: MARSMAITRE_PUBLIC_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: VOICE_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
